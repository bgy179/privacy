<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载 SunDial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #10202E;
    --sky-deep: #0A161F;
    --sand: #F2E9D8;
    --sand-dim: #C9BCA3;
    --gold: #E8A94A;
    --gold-dim: #B9843A;
    --rule: rgba(242, 233, 216, 0.14);
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--sky);
    color: var(--sand);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; margin: 0; }

  a { color: inherit; }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- Hero: sundial gnomon casting a moving shadow ---------- */

  .hero {
    position: relative;
    padding: 96px 0 72px;
    overflow: hidden;
    border-bottom: 1px solid var(--rule);
  }

  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(232,169,74,0.16), transparent 60%);
    pointer-events: none;
  }

  .dial {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin: 0 auto 48px;
    aspect-ratio: 2 / 1.05;
  }

  .dial svg { width: 100%; height: 100%; display: block; }

  .gnomon-shadow {
    transform-origin: 200px 180px;
    animation: sweep 6s ease-in-out infinite alternate;
  }

  @keyframes sweep {
    0%   { transform: rotate(-34deg); opacity: 0.9; }
    100% { transform: rotate(34deg);  opacity: 0.55; }
  }

  @media (prefers-reduced-motion: reduce) {
    .gnomon-shadow { animation: none; transform: rotate(0deg); }
  }

  .hero h1 {
    text-align: center;
    font-size: clamp(2.4rem, 5vw, 3.4rem);
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--sand);
  }

  .hero p.lede {
    text-align: center;
    max-width: 46ch;
    margin: 18px auto 0;
    color: var(--sand-dim);
    font-size: 1.05rem;
  }

  /* ---------- Platform downloads ---------- */

  .platforms {
    padding: 64px 0 16px;
  }

  .platforms h2 {
    font-size: 1.5rem;
    font-weight: 500;
    margin-bottom: 8px;
  }

  .platforms .sub {
    color: var(--sand-dim);
    font-size: 0.95rem;
    margin-bottom: 32px;
  }

  .platform-row {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--rule);
  }

  .platform {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 22px 4px;
    border-bottom: 1px solid var(--rule);
  }

  .platform .icon {
    flex: none;
    width: 34px;
    height: 34px;
    color: var(--gold);
  }

  .platform .icon svg { width: 100%; height: 100%; }

  .platform .meta {
    flex: 1 1 auto;
    min-width: 0;
  }

  .platform .meta .name {
    font-weight: 600;
    font-size: 1.05rem;
  }

  .platform .meta .detail {
    color: var(--sand-dim);
    font-size: 0.88rem;
    margin-top: 2px;
  }

  .platform .get {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 18px;
    background: var(--gold);
    color: var(--sky-deep);
    font-weight: 600;
    font-size: 0.92rem;
    text-decoration: none;
    border-radius: var(--radius);
    transition: background 0.15s ease;
  }

  .platform .get:hover { background: #f2bb6a; }

  .platform.unavailable .get {
    background: transparent;
    color: var(--sand-dim);
    border: 1px solid var(--rule);
    pointer-events: none;
  }

  /* ---------- Checksums / verify note ---------- */

  .verify {
    margin-top: 28px;
    font-size: 0.85rem;
    color: var(--sand-dim);
  }

  .verify code {
    background: rgba(242,233,216,0.08);
    padding: 2px 6px;
    border-radius: var(--radius);
    font-size: 0.82em;
  }

  /* ---------- Version history ---------- */

  .history {
    padding: 56px 0 96px;
  }

  .history h2 {
    font-size: 1.5rem;
    font-weight: 500;
    margin-bottom: 28px;
  }

  .entry {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 24px;
    padding: 20px 0;
    border-top: 1px solid var(--rule);
  }

  .entry:last-child { border-bottom: 1px solid var(--rule); }

  .entry .version {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 1.1rem;
    color: var(--gold);
    white-space: nowrap;
  }

  .entry .date {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    color: var(--sand-dim);
    margin-top: 4px;
  }

  .entry .notes {
    font-size: 0.94rem;
    color: var(--sand-dim);
  }

  .entry .notes strong { color: var(--sand); font-weight: 500; }

  .entry .notes ul {
    margin: 6px 0 0;
    padding-left: 18px;
  }

  .entry .notes li { margin: 3px 0; }

  .entry .all-link {
    display: inline-block;
    margin-top: 4px;
    font-size: 0.9rem;
    color: var(--sand-dim);
    border-bottom: 1px solid var(--rule);
  }

  footer {
    border-top: 1px solid var(--rule);
    padding: 28px 0 48px;
    font-size: 0.82rem;
    color: var(--sand-dim);
    text-align: center;
  }

  @media (max-width: 560px) {
    .entry { grid-template-columns: 1fr; gap: 4px; }
    .platform { flex-wrap: wrap; }
    .platform .get { margin-left: 54px; }
  }
</style>
</head>
